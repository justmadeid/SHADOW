  /node-definitions:
    get:
      operationId: listNodeDefinitions
      summary: List the latest ACTIVE version of each NodeDefinition
      tags: [Workflow]
      description: >-
        Global platform capability catalog; requires only an authenticated
        principal, with no Case/Workspace scoping. There is no public write
        endpoint: NodeDefinition registration is a trusted internal
        application port (see ADR-017). The catalog ships empty; no
        production capability rows are seeded by P3-001.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bounded page of the latest ACTIVE version per key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/NodeDefinition" }
                  page:
                    type: object
                    additionalProperties: false
                    required: [hasMore, nextCursor]
                    properties:
                      hasMore: { type: boolean }
                      nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/WorkflowError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /node-definitions/{key}/versions/{version}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getNodeDefinitionVersion
      summary: Read one exact NodeDefinition version
      tags: [Workflow]
      responses:
        "200":
          description: NodeDefinition detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeDefinition" }
        "400": { $ref: "#/components/responses/WorkflowError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NodeDefinitionNotFound" }
  /investigations/{investigationId}/nodes:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    post:
      operationId: createNodeInstance
      summary: Create a NodeInstance bound to an ACTIVE NodeDefinition
      tags: [Workflow]
      description: >-
        Requires WORKFLOW_CREATE on the owning Case and an ACTIVE parent
        Investigation. Initial configuration is validated against the
        NodeDefinition's configSchema. Starts DRAFT, or READY immediately
        when the NodeDefinition declares zero required inputs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeInstanceRequest" }
      responses:
        "201":
          description: Created or replayed NodeInstance
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInstance" }
        "400": { $ref: "#/components/responses/WorkflowError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/WorkflowError" }
        "409": { $ref: "#/components/responses/WorkflowError" }
  /nodes/{nodeInstanceId}:
    parameters:
      - $ref: "#/components/parameters/NodeInstanceId"
    get:
      operationId: getNodeInstance
      summary: Read an accessible NodeInstance and its InputBindings
      tags: [Workflow]
      responses:
        "200":
          description: NodeInstance detail with the current InputBinding set
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInstanceDetail" }
        "400": { $ref: "#/components/responses/WorkflowError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/NodeInstanceNotFound" }
    patch:
      operationId: updateNodeInstance
      summary: Update a NodeInstance's configuration
      tags: [Workflow]
      description: >-
        Configuration only; re-validated against the NodeDefinition's
        configSchema. Requires WORKFLOW_UPDATE and If-Match. Rejected once
        the NodeInstance is ARCHIVED.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNodeInstanceRequest" }
      responses:
        "200":
          description: Updated NodeInstance
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInstance" }
        "400": { $ref: "#/components/responses/WorkflowError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/NodeInstanceNotFound" }
        "409": { $ref: "#/components/responses/WorkflowError" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
    delete:
      operationId: archiveNodeInstance
      summary: Soft-archive a NodeInstance (terminal; not a SQL DELETE)
      tags: [Workflow]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: NodeInstance archived
        "400": { $ref: "#/components/responses/WorkflowError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/NodeInstanceNotFound" }
        "409": { $ref: "#/components/responses/WorkflowError" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /nodes/{nodeInstanceId}/input-bindings:
    parameters:
      - $ref: "#/components/parameters/NodeInstanceId"
    post:
      operationId: replaceNodeInstanceInputBindings
      summary: Replace the full InputBinding set for a NodeInstance
      tags: [Workflow]
      description: >-
        Replaces (not appends) the complete binding set. Every targetInput
        must name a declared NodeDefinition input with no duplicates, and
        sourceType must equal that input's declared type; any violation
        rejects the whole request with nothing persisted. Recomputes status
        to READY iff every required input is now bound. Requires
        WORKFLOW_UPDATE and If-Match.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceInputBindingsRequest" }
      responses:
        "200":
          description: NodeInstance with its replaced InputBinding set
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeInstanceDetail" }
        "400": { $ref: "#/components/responses/InputBindingInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/NodeInstanceNotFound" }
        "409": { $ref: "#/components/responses/WorkflowError" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /investigations/{investigationId}/workflow-edges:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    post:
      operationId: createWorkflowEdge
      summary: Connect two NodeInstances of the same Investigation
      tags: [Workflow]
      description: >-
        Rejects a self-loop, a duplicate edge, either NodeInstance not
        belonging to this Investigation, or an edge that would create a
        cycle (checked by traversal over existing edges inside the same
        locked transaction).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkflowEdgeRequest" }
      responses:
        "201":
          description: Created WorkflowEdge
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowEdge" }
        "400": { $ref: "#/components/responses/WorkflowError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/WorkflowError" }
        "409": { $ref: "#/components/responses/WorkflowError" }
  /nodes/{nodeInstanceId}/actions/run:
    parameters:
      - $ref: "#/components/parameters/NodeInstanceId"
    post:
      operationId: createRun
      summary: Create a Run from a READY NodeInstance
      tags: [Execution]
      description: >-
        Requires RUN_CREATE and a READY NodeInstance. Atomically inserts the
        Run row, an idempotency record, a run_revisions history row and
        exactly one metadata-only RUN_CREATED Outbox event (Run + Outbox is
        atomic; see ADR-019). The Run starts QUEUED; nothing in this slice
        transitions it further (no worker exists yet — see P3-004+).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Created Run
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/NodeInstanceNotFound" }
        "409":
          description: NodeInstance is not READY, or idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: Read an accessible Run
      tags: [Execution]
      responses:
        "200":
          description: Run detail, including its frozen inputSnapshot
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/RunNotFound" }
  /cases/{caseId}/runs:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: listRuns
      summary: List Runs in an accessible Case
      tags: [Execution]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bounded Run page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/Run" }
                  page:
                    type: object
                    additionalProperties: false
                    required: [hasMore, nextCursor]
                    properties:
                      hasMore: { type: boolean }
                      nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
  /runs/{runId}/actions/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: cancelRun
      summary: Cancel a QUEUED or RUNNING Run
      tags: [Execution]
      description: Requires RUN_CANCEL and If-Match. Terminal CANCELLED on success.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Cancelled Run
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/RunNotFound" }
        "409":
          description: Only a QUEUED or RUNNING Run can be cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /runs/{runId}/actions/retry:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: retryRun
      summary: Create a new Run retrying a terminal FAILED/PARTIAL/CANCELLED Run
      tags: [Execution]
      description: >-
        Business retry: takes a fresh snapshot of the NodeInstance's current
        configuration/InputBindings (not a replay of the original Run's
        stale snapshot) and creates a new Run with retryOf set to the
        original Run's id. Requires the original Run's If-Match and a new
        Idempotency-Key. Re-validates the NodeInstance is still READY.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: New retry Run
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/RunNotFound" }
        "409":
          description: Original Run is not in a terminal state, NodeInstance is not READY, or idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /runs/{runId}/attempts:
    servers:
      - url: /internal/v1
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: createExecutionAttempt
      summary: Lease a new ExecutionAttempt on a Run
      tags: [Execution]
      security:
        - oidcAccessToken: []
      description: >-
        Internal worker API; requires a SERVICE principal (403
        AUTH_SERVICE_REQUIRED for a USER principal), never Case-membership
        authorization. Idempotent on (workerIdentity, Idempotency-Key).
        Rejects a terminal Run (409 RUN_NOT_ATTEMPTABLE) and a still-live
        attempt (409 RUN_ATTEMPT_ALREADY_ACTIVE). A stale LEASED/RUNNING
        attempt whose lease has expired is lazily marked LOST first. On the
        first attempt for a Run this also transitions the Run QUEUED ->
        RUNNING and sets startedAt (see ADR-020). Infrastructure retry
        (P3-004 acceptance criterion) creates a new Attempt on the same Run
        after a retryable fail.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [leaseOwner, leaseDurationSeconds]
              properties:
                leaseOwner: { type: string, minLength: 1, maxLength: 200 }
                leaseDurationSeconds: { type: integer, minimum: 1, maximum: 300 }
      responses:
        "201":
          description: Created (or idempotently replayed) ExecutionAttempt
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionAttempt" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ServicePrincipalRequired" }
        "404": { $ref: "#/components/responses/RunNotFound" }
        "409":
          description: Run not attemptable, an attempt is already active, or idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /runs/{runId}/progress:
    servers:
      - url: /internal/v1
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: recordExecutionAttemptProgress
      summary: Heartbeat and record factual progress for the Run's active ExecutionAttempt
      tags: [Execution]
      security:
        - oidcAccessToken: []
      description: >-
        The only heartbeat mechanism; extends the active attempt's lease by
        its fixed leaseDurationSeconds and flips LEASED -> RUNNING on first
        call. total stays nullable and is never used to derive a percentage
        (Execution Gate). No If-Match is required: correctness comes from
        attemptId matching the Run's current active attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attemptId, stage]
              properties:
                attemptId: { type: string, format: uuid }
                stage: { type: string, minLength: 1, maxLength: 64 }
                processed: { type: [integer, "null"], minimum: 0 }
                produced: { type: [integer, "null"], minimum: 0 }
                total: { type: [integer, "null"], minimum: 0 }
      responses:
        "200":
          description: Updated ExecutionAttempt
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionAttempt" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ServicePrincipalRequired" }
        "404":
          description: ExecutionAttempt absent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: attemptId is not the Run's current active attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /runs/{runId}/actions/complete:
    servers:
      - url: /internal/v1
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: completeRun
      summary: Mark the Run's active ExecutionAttempt SUCCEEDED and the Run terminal
      tags: [Execution]
      security:
        - oidcAccessToken: []
      description: >-
        Idempotent by exact attempt+outcome replay: a Run already terminal
        with this same attempt and outcome returns the current state; a
        different attempt or outcome is 409 RUN_ALREADY_TERMINAL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attemptId, outcome]
              properties:
                attemptId: { type: string, format: uuid }
                outcome: { type: string, enum: [COMPLETED, PARTIAL] }
      responses:
        "200":
          description: Terminal Run
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ServicePrincipalRequired" }
        "404":
          description: Run or ExecutionAttempt absent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: attemptId is not the Run's current active attempt, or the Run is already terminal with a different attempt/outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /runs/{runId}/actions/fail:
    servers:
      - url: /internal/v1
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: failRun
      summary: Mark the Run's active ExecutionAttempt FAILED, requeueing or terminating the Run
      tags: [Execution]
      security:
        - oidcAccessToken: []
      description: >-
        retryable=true requeues the Run (QUEUED) so a new ExecutionAttempt
        can be created on it (P3-004 acceptance criterion); retryable=false
        terminates the Run FAILED. Only a boolean retryable flag exists in
        this slice, not an error-code taxonomy (P3-011).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attemptId, errorCode, retryable]
              properties:
                attemptId: { type: string, format: uuid }
                errorCode:
                  type: string
                  pattern: '^[A-Z][A-Z0-9_]{2,63}$'
                retryable: { type: boolean }
      responses:
        "200":
          description: Requeued or terminal Run
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ServicePrincipalRequired" }
        "404":
          description: Run or ExecutionAttempt absent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: attemptId is not the Run's current active attempt, or the Run is already terminal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /runs/{runId}/execution-plan:
    servers:
      - url: /internal/v1
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getExecutionPlan
      summary: Read the ExecutionPlan for the Run's current active ExecutionAttempt
      tags: [Execution]
      security:
        - oidcAccessToken: []
      description: >-
        Requires a currently active (LEASED/RUNNING, unexpired) Attempt, else
        409 RUN_EXECUTION_PLAN_NOT_AVAILABLE. connector and checkpoint are
        always null in this slice (see ADR-021). Structurally never carries a
        secret/apiKey/token/credential/password-shaped field.
      responses:
        "200":
          description: ExecutionPlan for the Run's active Attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPlan" }
        "400": { $ref: "#/components/responses/RunError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ServicePrincipalRequired" }
        "404": { $ref: "#/components/responses/RunNotFound" }
        "409":
          description: The Run has no currently active ExecutionAttempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Read authenticated platform runtime information
      tags: [System]
      responses:
        "200":
          description: Platform runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          description: Missing, malformed, expired, or otherwise invalid access token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer authentication challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted revision from the latest representation ETag.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
        example: '"1"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: '^[A-Za-z0-9._~:+/-]+$'
    AuditOperationId:
      name: X-Audit-Operation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    InvestigationId:
      name: investigationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NodeInstanceId:
      name: nodeInstanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    SubjectSuccess:
      description: Current Subject revision
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/InvestigationSubject" }
    EntitySuccess:
      description: Current Entity revision
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Entity" }
    ResolutionSuccess:
      description: Current Resolution session revision
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResolutionSession" }
    CandidateSuccess:
      description: Current Candidate revision
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Candidate" }
    EntityError:
      description: Invalid input, undisclosed resource, authorization/lifecycle/idempotency conflict or sanitized persistence failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SubjectError:
      description: Invalid input, undisclosed resource, lifecycle/idempotency conflict or sanitized persistence failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TargetProfileNotFound:
      description: Target Profile absent, Case/Subject pair mismatch, or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ResolutionError:
      description: Invalid input, undisclosed resource, lifecycle/idempotency conflict or sanitized persistence failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseMutationSuccess:
      description: Mutated Case
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Case" }
    CaseMutationInvalid:
      description: Invalid Case identifier or If-Match header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthenticated:
      description: Invalid authentication
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UserPrincipalRequired:
      description: Operation requires a user principal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServicePrincipalRequired:
      description: Internal worker API operation requires an authenticated SERVICE principal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseNotFound:
      description: Case absent or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseTransitionConflict:
      description: Case status transition is not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseRevisionMismatch:
      description: If-Match revision is stale
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvestigationMutationInvalid:
      description: Invalid Investigation request, identifier, or If-Match header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvestigationNotFound:
      description: Investigation absent or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    WorkflowError:
      description: Invalid input, undisclosed resource, or lifecycle/idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InputBindingInvalid:
      description: An InputBinding targetInput/sourceType is invalid; nothing is persisted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NodeDefinitionNotFound:
      description: NodeDefinition key+version absent
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NodeInstanceNotFound:
      description: NodeInstance absent or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RunError:
      description: Invalid input, undisclosed resource, or lifecycle/idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RunNotFound:
      description: Run absent or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  securitySchemes:
    oidcAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token validated against the configured issuer JWKS.
  schemas:
    EntityType:
      type: string
      enum: [PERSON, ORGANIZATION, SOCIAL_ACCOUNT, EMAIL_ADDRESS, PHONE_NUMBER, LOCATION, ADDRESS, DOMAIN, WEBSITE, IP_ADDRESS, VEHICLE, DEVICE, DOCUMENT, EVENT]
    EntityAlias:
      type: object
      additionalProperties: false
      required: [id, label, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 200 }
        createdAt: { type: string, format: date-time }
    EntityRef:
      type: object
      additionalProperties: false
      required: [type, id, workspaceId]
      properties:
        type: { const: ENTITY }
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
    Entity:
      type: object
      additionalProperties: false
      required: [id, workspaceId, type, status, canonicalLabel, aliases, mergedInto, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/EntityType" }
        status: { type: string, enum: [ACTIVE, MERGED, ARCHIVED] }
        canonicalLabel: { type: string, minLength: 1, maxLength: 200 }
        aliases:
          type: array
          items: { $ref: "#/components/schemas/EntityAlias" }
        mergedInto:
          oneOf:
            - $ref: "#/components/schemas/EntityRef"
            - type: "null"
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateEntity:
      type: object
      additionalProperties: false
      required: [type, canonicalLabel]
      properties:
        type: { $ref: "#/components/schemas/EntityType" }
        canonicalLabel: { type: string, minLength: 1, maxLength: 200 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
    UpdateEntity:
      oneOf:
        - type: object
          additionalProperties: false
          required: [canonicalLabel]
          properties:
            canonicalLabel: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          additionalProperties: false
          required: [alias]
          properties:
            alias: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { const: ARCHIVED }
    EntityMergeReasonCode:
      type: string
      enum: [DUPLICATE_IDENTITY, EXACT_IDENTIFIER_MATCH, MULTIPLE_SUPPORTING_SIGNALS, DATA_CORRECTION, MANUAL_REVIEW]
    MergeEntity:
      type: object
      additionalProperties: false
      required: [absorbedEntityId, absorbedRevision, reasonCode]
      properties:
        absorbedEntityId: { type: string, format: uuid }
        absorbedRevision: { type: integer, minimum: 1 }
        reasonCode: { $ref: "#/components/schemas/EntityMergeReasonCode" }
    EntityMergeDecision:
      type: object
      additionalProperties: false
      required: [id, operationId, workspaceId, survivorEntityId, absorbedEntityId, survivorRevision, absorbedRevision, reasonCode, createdAt]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        survivorEntityId: { type: string, format: uuid }
        absorbedEntityId: { type: string, format: uuid }
        survivorRevision: { type: integer, minimum: 2 }
        absorbedRevision: { type: integer, minimum: 2 }
        reasonCode: { $ref: "#/components/schemas/EntityMergeReasonCode" }
        createdAt: { type: string, format: date-time }
    EntityMergeReverseReasonCode:
      type: string
      enum: [INCORRECT_IDENTITY_MATCH, INSUFFICIENT_EVIDENCE, WRONG_SURVIVOR_SELECTED, DATA_CORRECTION, MANUAL_REVIEW]
    ReverseEntityMerge:
      type: object
      additionalProperties: false
      required: [survivorRevision, absorbedRevision, reasonCode]
      properties:
        survivorRevision: { type: integer, minimum: 1 }
        absorbedRevision: { type: integer, minimum: 1 }
        reasonCode: { $ref: "#/components/schemas/EntityMergeReverseReasonCode" }
    EntityMergeReversalDecision:
      type: object
      additionalProperties: false
      required: [id, operationId, entityMergeId, workspaceId, survivorEntityId, restoredEntityId, survivorRevision, restoredEntityRevision, reasonCode, createdAt]
      properties:
        id: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        entityMergeId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        survivorEntityId: { type: string, format: uuid }
        restoredEntityId: { type: string, format: uuid }
        survivorRevision: { type: integer, minimum: 2 }
        restoredEntityRevision: { type: integer, minimum: 3 }
        reasonCode: { $ref: "#/components/schemas/EntityMergeReverseReasonCode" }
        createdAt: { type: string, format: date-time }
    IdentifierType:
      type: string
      enum: [NATIONAL_ID, PHONE, EMAIL, PLATFORM_USER_ID, USERNAME, INTERNAL_RESIDENT_ID]
    CreateIdentifier:
      type: object
      additionalProperties: false
      required: [type, value, classification]
      properties:
        type: { $ref: "#/components/schemas/IdentifierType" }
        value:
          type: string
          minLength: 3
          maxLength: 320
          description: Protected input; never echoed, logged, queued or stored in plaintext.
        classification: { $ref: "#/components/schemas/DataClassification" }
    IdentifierView:
      type: object
      additionalProperties: false
      required: [id, entityId, workspaceId, type, classification, status, revision, createdAt, updatedAt, visibility]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/IdentifierType" }
        classification: { $ref: "#/components/schemas/DataClassification" }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        visibility: { type: string, enum: [FULL, MASKED, MATCH_ONLY, HIDDEN] }
        displayValue:
          type: string
          description: Present only for FULL or MASKED; MASKED is always four bullets.
        matchStatus:
          type: string
          enum: [EXACT_MATCH, NO_MATCH, UNKNOWN]
          description: Present only for MATCH_ONLY; this read endpoint returns UNKNOWN.
    SubjectType:
      type: string
      enum: [PERSON, ORGANIZATION, SOCIAL_ACCOUNT, DOMAIN, UNKNOWN]
    SubjectRole:
      type: string
      enum: [PRIMARY_TARGET, SECONDARY_TARGET, PERSON_OF_INTEREST, RELATED_PERSON, WITNESS, UNKNOWN]
    CreateSubject:
      type: object
      additionalProperties: false
      required: [subjectType, role]
      properties:
        subjectType: { $ref: "#/components/schemas/SubjectType" }
        role: { $ref: "#/components/schemas/SubjectRole" }
        investigationId: { type: [string, "null"], format: uuid }
        seed: { $ref: "#/components/schemas/CreateSubjectSeed" }
    SubjectSeedFieldName:
      type: string
      enum: [DISPLAY_NAME, ORGANIZATION_NAME, USERNAME, DOMAIN_NAME, LOCATION_TEXT, SOCIAL_PROFILE_URL]
    CreateSubjectSeed:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [name, value, origin, classification]
            properties:
              name: { $ref: "#/components/schemas/SubjectSeedFieldName" }
              value:
                type: string
                minLength: 1
                maxLength: 2000
                description: Field-specific normalization applies; non-URL fields permit at most 300 characters.
              origin:
                type: string
                const: INVESTIGATOR_INPUT
                description: Public callers cannot assert Evidence, Source Record, extraction or import provenance.
              classification:
                allOf:
                  - $ref: "#/components/schemas/DataClassification"
                description: RESTRICTED seed values remain rejected; protected identifiers must use the P2-004 Entity Identifier endpoints.
    SubjectSeedSummary:
      type: object
      additionalProperties: false
      required: [id, fieldCount]
      properties:
        id: { type: string, format: uuid }
        fieldCount: { type: integer, minimum: 1, maximum: 20 }
    SubjectSeedProvenanceRef:
      type: object
      additionalProperties: false
      required: [type, id, workspaceId, caseId]
      properties:
        type: { type: string, enum: [EVIDENCE, SOURCE_RECORD] }
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
    PresentedSubjectSeedValue:
      oneOf:
        - type: object
          additionalProperties: false
          required: [classification, visibility, displayValue]
          properties:
            classification: { $ref: "#/components/schemas/DataClassification" }
            visibility: { const: FULL }
            displayValue: { type: string }
        - type: object
          additionalProperties: false
          required: [classification, visibility, displayValue]
          properties:
            classification: { const: SENSITIVE }
            visibility: { const: MASKED }
            displayValue: { const: "••••" }
    SubjectSeed:
      type: object
      additionalProperties: false
      required: [id, subjectId, workspaceId, caseId, fields, createdAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        fields:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, ordinal, name, origin, classification, evidenceRef, sourceRecordRef, value]
            properties:
              id: { type: string, format: uuid }
              ordinal: { type: integer, minimum: 0, maximum: 19 }
              name: { $ref: "#/components/schemas/SubjectSeedFieldName" }
              origin: { type: string, enum: [INVESTIGATOR_INPUT, SOURCE_RECORD, EVIDENCE, ANALYSIS_EXTRACTION, IMPORT] }
              classification: { $ref: "#/components/schemas/DataClassification" }
              evidenceRef:
                oneOf:
                  - $ref: "#/components/schemas/SubjectSeedProvenanceRef"
                  - type: "null"
              sourceRecordRef:
                oneOf:
                  - $ref: "#/components/schemas/SubjectSeedProvenanceRef"
                  - type: "null"
              value: { $ref: "#/components/schemas/PresentedSubjectSeedValue" }
    UpdateSubject:
      oneOf:
        - type: object
          additionalProperties: false
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/SubjectRole" }
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { const: ARCHIVED }
    InvestigationSubject:
      type: object
      additionalProperties: false
      required: [id, workspaceId, caseId, investigationId, subjectType, role, status, entityRef, seed, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        investigationId: { type: [string, "null"], format: uuid }
        subjectType: { $ref: "#/components/schemas/SubjectType" }
        role: { $ref: "#/components/schemas/SubjectRole" }
        status:
          type: string
          enum: [UNRESOLVED, RESOLVING, RESOLVED, RESOLUTION_FAILED, ARCHIVED]
        entityRef:
          oneOf:
            - $ref: "#/components/schemas/EntityRef"
            - type: "null"
        seed:
          oneOf:
            - $ref: "#/components/schemas/SubjectSeedSummary"
            - type: "null"
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TargetProfileIdentitySummary:
      type: object
      additionalProperties: false
      required: [displayLabel, type, resolutionStatus, aliases, identifiers]
      properties:
        displayLabel: { type: [string, "null"], maxLength: 200 }
        type:
          type: string
          enum: [PERSON, ORGANIZATION, SOCIAL_ACCOUNT, EMAIL_ADDRESS, PHONE_NUMBER, LOCATION, ADDRESS, DOMAIN, WEBSITE, IP_ADDRESS, VEHICLE, DEVICE, DOCUMENT, EVENT, UNKNOWN]
        resolutionStatus:
          type: string
          enum: [UNRESOLVED, RESOLVING, RESOLVED, RESOLUTION_FAILED, ARCHIVED]
        aliases:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/EntityAlias" }
        identifiers:
          type: array
          maxItems: 100
          items:
            allOf:
              - $ref: "#/components/schemas/IdentifierView"
              - type: object
                required: [displayValue]
                properties:
                  status: { const: ACTIVE }
                  visibility: { const: MASKED }
                  displayValue: { const: "••••" }
    TargetProfileSectionAvailability:
      type: object
      additionalProperties: false
      required: [workspaceKnowledge, sourceCoverage, accounts, evidence, discoveries, reviews, searches]
      properties:
        workspaceKnowledge: { const: NOT_IMPLEMENTED }
        sourceCoverage: { const: NOT_IMPLEMENTED }
        accounts: { const: NOT_IMPLEMENTED }
        evidence: { const: NOT_IMPLEMENTED }
        discoveries: { const: NOT_IMPLEMENTED }
        reviews: { const: NOT_IMPLEMENTED }
        searches: { const: NOT_IMPLEMENTED }
    TargetProfileAvailableViews:
      type: object
      additionalProperties: false
      required: [overview, canvas, timeline, map]
      properties:
        overview: { const: true }
        canvas: { const: false }
        timeline: { const: false }
        map: { const: false }
    TargetProfileFreshness:
      type: object
      additionalProperties: false
      required: [mode, generatedAt, sourceUpdatedAt, isStale, subjectRevision, entityRevision, latestIdentifierRevision, workspaceKnowledgeUpdatedAt]
      properties:
        mode: { const: CANONICAL }
        generatedAt: { type: string, format: date-time }
        sourceUpdatedAt: { type: string, format: date-time }
        isStale: { const: false }
        subjectRevision: { type: integer, minimum: 1 }
        entityRevision: { type: [integer, "null"], minimum: 1 }
        latestIdentifierRevision: { type: [integer, "null"], minimum: 1 }
        workspaceKnowledgeUpdatedAt: { type: "null" }
    TargetProfileView:
      type: object
      additionalProperties: false
      required: [id, workspaceId, caseId, subject, entity, identitySummary, workspaceKnowledge, sourceCoverage, accountSummary, evidenceSummary, discoverySummary, openReviewSummary, recentSearches, recentEvidence, recentDiscoveries, sectionAvailability, availableViews, freshness]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        subject: { $ref: "#/components/schemas/InvestigationSubject" }
        entity:
          oneOf:
            - $ref: "#/components/schemas/Entity"
            - type: "null"
        identitySummary: { $ref: "#/components/schemas/TargetProfileIdentitySummary" }
        workspaceKnowledge: { type: array, maxItems: 0, items: {} }
        sourceCoverage: { type: array, maxItems: 0, items: {} }
        accountSummary: { type: array, maxItems: 0, items: {} }
        evidenceSummary:
          type: object
          additionalProperties: false
          required: [total]
          properties: { total: { type: "null" } }
        discoverySummary:
          type: object
          additionalProperties: false
          required: [total]
          properties: { total: { type: "null" } }
        openReviewSummary:
          type: object
          additionalProperties: false
          required: [total]
          properties: { total: { type: "null" } }
        recentSearches: { type: array, maxItems: 0, items: {} }
        recentEvidence: { type: array, maxItems: 0, items: {} }
        recentDiscoveries: { type: array, maxItems: 0, items: {} }
        sectionAvailability: { $ref: "#/components/schemas/TargetProfileSectionAvailability" }
        availableViews: { $ref: "#/components/schemas/TargetProfileAvailableViews" }
        freshness: { $ref: "#/components/schemas/TargetProfileFreshness" }
    ResolutionSession:
      type: object
      additionalProperties: false
      required: [id, subjectId, workspaceId, caseId, status, candidatesCount, selectedCandidateId, resolutionDecisionId, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        status: { type: string, enum: [SEARCHING, NEEDS_REVIEW, RESOLVED, CLOSED] }
        candidatesCount: { type: integer, minimum: 0 }
        selectedCandidateId: { type: [string, "null"], format: uuid }
        resolutionDecisionId: { type: [string, "null"], format: uuid }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StartResolutionResult:
      type: object
      additionalProperties: false
      required: [resolution, subject]
      properties:
        resolution: { $ref: "#/components/schemas/ResolutionSession" }
        subject: { $ref: "#/components/schemas/InvestigationSubject" }
    ResolutionDecision:
      type: object
      additionalProperties: false
      required: [id, resolutionSessionId, candidateId, decision, targetEntityId, reasonCode, decidedByUserId, decidedAt]
      properties:
        id: { type: string, format: uuid }
        resolutionSessionId: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        decision: { type: string, enum: [LINK_EXISTING, CREATE_NEW, UNCERTAIN, REJECT] }
        targetEntityId: { type: [string, "null"], format: uuid }
        reasonCode:
          type: string
          enum: [EXACT_IDENTIFIER_MATCH, MULTIPLE_SUPPORTING_SIGNALS, INSUFFICIENT_EVIDENCE, CONFLICTING_SIGNALS, NOT_SAME_IDENTITY, MANUAL_REVIEW]
        decidedByUserId: { type: string }
        decidedAt: { type: string, format: date-time }
    ResolveCandidateRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [decision, entityId, reasonCode]
          properties:
            decision: { const: LINK_EXISTING }
            entityId: { type: string, format: uuid }
            reasonCode: { $ref: "#/components/schemas/ResolutionReasonCode" }
        - type: object
          additionalProperties: false
          required: [decision, reasonCode]
          properties:
            decision: { type: string, enum: [CREATE_NEW, UNCERTAIN, REJECT] }
            reasonCode: { $ref: "#/components/schemas/ResolutionReasonCode" }
    ResolutionReasonCode:
      type: string
      enum: [EXACT_IDENTIFIER_MATCH, MULTIPLE_SUPPORTING_SIGNALS, INSUFFICIENT_EVIDENCE, CONFLICTING_SIGNALS, NOT_SAME_IDENTITY, MANUAL_REVIEW]
    CandidateResolutionResult:
      type: object
      additionalProperties: false
      required: [decision, candidate, resolution, subject]
      properties:
        decision: { $ref: "#/components/schemas/ResolutionDecision" }
        candidate: { $ref: "#/components/schemas/Candidate" }
        resolution: { $ref: "#/components/schemas/ResolutionSession" }
        subject: { $ref: "#/components/schemas/InvestigationSubject" }
    CandidateResourceRef:
      type: object
      additionalProperties: false
      required: [type, id, workspaceId, caseId]
      properties:
        type: { type: string, enum: [SOURCE_RECORD, EVIDENCE, RUN, ANALYSIS] }
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
    CandidateSource:
      type: object
      additionalProperties: false
      required: [origin, resource]
      properties:
        origin: { type: string, enum: [INVESTIGATOR_INPUT, SOURCE_RECORD, EVIDENCE, RUN, ANALYSIS_EXTRACTION, IMPORT] }
        resource:
          oneOf:
            - $ref: "#/components/schemas/CandidateResourceRef"
            - type: "null"
    Candidate:
      type: object
      additionalProperties: false
      required: [id, resolutionSessionId, subjectId, workspaceId, caseId, type, status, displayLabel, classification, source, evidenceRefs, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        resolutionSessionId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        type: { type: string, enum: [PERSON, ORGANIZATION, SOCIAL_ACCOUNT, DOMAIN] }
        status: { type: string, enum: [PENDING_REVIEW, RESOLVED, REJECTED, UNCERTAIN] }
        displayLabel: { type: string, minLength: 1, maxLength: 200 }
        classification:
          type: string
          enum: [PUBLIC, INTERNAL, SENSITIVE, RESTRICTED]
          description: RESTRICTED Candidates always use the fixed displayLabel "Restricted candidate"; a raw restricted label is never accepted or persisted.
        source: { $ref: "#/components/schemas/CandidateSource" }
        evidenceRefs:
          type: array
          maxItems: 20
          items:
            allOf:
              - $ref: "#/components/schemas/CandidateResourceRef"
              - type: object
                properties:
                  type: { const: EVIDENCE }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EntityMatchSignal:
      type: object
      additionalProperties: false
      required: [field, result, strength, valueVisibility]
      properties:
        field:
          type: string
          enum: [NATIONAL_ID, PHONE, EMAIL, PLATFORM_USER_ID, USERNAME, INTERNAL_RESIDENT_ID, NAME, DATE_OF_BIRTH, DOMAIN, ACCOUNT_HANDLE]
        result: { type: string, enum: [EXACT_MATCH, PARTIAL_MATCH, NO_MATCH, CONFLICT] }
        strength: { type: string, enum: [WEAK, SUPPORTING, STRONG, CONTRADICTING] }
        valueVisibility: { type: string, enum: [FULL, MASKED, MATCH_ONLY] }
    EntityMatch:
      type: object
      additionalProperties: false
      required: [id, candidateId, entityRef, matchLevel, signals, conflicts, crossCaseContext, createdAt]
      properties:
        id: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        entityRef: { $ref: "#/components/schemas/EntityRef" }
        matchLevel: { type: string, enum: [LOW, MEDIUM, HIGH, VERY_HIGH] }
        signals:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EntityMatchSignal" }
        conflicts:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EntityMatchSignal" }
        crossCaseContext:
          type: object
          additionalProperties: false
          required: [exists, detailsVisible]
          properties:
            exists: { type: boolean, const: true }
            detailsVisible:
              type: boolean
              description: Permission capability only; no cross-Case details are returned by P2-007.
        createdAt: { type: string, format: date-time }
    EntityMatchPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EntityMatch" }
        page:
          type: object
          additionalProperties: false
          required: [hasMore, nextCursor]
          properties:
            hasMore: { type: boolean }
            nextCursor: { type: [string, "null"] }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name, slug, locale, timeZone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$"
        locale:
          type: string
        timeZone:
          type: string
    WorkspaceSettings:
      type: object
      additionalProperties: false
      required: [locale, timeZone]
      properties:
        locale: { type: string }
        timeZone: { type: string }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, settings, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
        revision:
          type: integer
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Workspace"
    DataClassification:
      type: string
      enum: [PUBLIC, INTERNAL, SENSITIVE, RESTRICTED]
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, title, classification]
      properties:
        workspaceId: { type: string, format: uuid }
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 4000
        classification:
          $ref: "#/components/schemas/DataClassification"
    UpdateCaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 4000
        classification:
          $ref: "#/components/schemas/DataClassification"
    Case:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - workspaceId
        - title
        - description
        - status
        - classification
        - handling
        - revision
        - createdAt
        - updatedAt
        - closedAt
        - archivedAt
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          pattern: "^CASE-[0-9]{4}-[A-F0-9]{10}$"
        workspaceId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        status:
          type: string
          enum: [DRAFT, ACTIVE, CLOSED, ARCHIVED]
        classification:
          $ref: "#/components/schemas/DataClassification"
        handling:
          $ref: "#/components/schemas/ClassificationHandling"
        revision:
          type: integer
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    ClassificationHandling:
      type: object
      description: >-
        Server-derived P1-007 handling obligations, not authorization or proof
        of downstream enforcement. Clients must not override these values.
        PUBLIC does not bypass authenticated resource access. P1-007 does not
        turn these hints into export, retention, indexing, or source runtimes.
      additionalProperties: false
      required: [classification, policyVersion, identifierDefaultVisibility, applicationLogs, metricsLabels, queuePayload, searchProjection, rawPersistence, export, workerRouting, retention, objectAccess, crossCaseDisclosure]
      properties:
        classification:
          $ref: "#/components/schemas/DataClassification"
        policyVersion: { type: integer, const: 1 }
        identifierDefaultVisibility: { type: string, enum: [FULL, MASKED] }
        applicationLogs: { type: string, const: METADATA_ONLY }
        metricsLabels: { type: string, const: NO_CONTENT }
        queuePayload: { type: string, enum: [REFERENCES_ONLY, REFERENCES_AND_METADATA] }
        searchProjection: { type: string, enum: [ALLOWED_FIELDS, SCOPED, MINIMIZED_SCOPED, NO_RAW_VALUES] }
        rawPersistence: { type: string, enum: [SOURCE_POLICY, MINIMIZED, DISABLED_BY_DEFAULT] }
        export: { type: string, enum: [POLICY_REQUIRED, PERMISSION_REQUIRED, EXPLICIT_POLICY_REQUIRED, REDACTED_ONLY] }
        workerRouting: { type: string, enum: [GENERAL, POLICY_DEPENDENT, RESTRICTED] }
        retention: { type: string, enum: [SOURCE_POLICY, EXPLICIT, EXPLICIT_MINIMIZED] }
        objectAccess: { type: string, enum: [SCOPED, SHORT_LIVED, SHORT_LIVED_STRICT_AUTH] }
        crossCaseDisclosure: { type: string, enum: [POLICY_REQUIRED, EXPLICIT_PERMISSION, DENY_BY_DEFAULT] }
    CaseList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        page:
          type: object
          additionalProperties: false
          required: [hasMore, nextCursor]
          properties:
            hasMore: { type: boolean }
            nextCursor: { type: [string, "null"] }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Case"
    InvestigationStatus:
      type: string
      enum: [ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    CreateInvestigationRequest:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        objective: { type: string, minLength: 3, maxLength: 2000 }
    UpdateInvestigationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        objective: { type: string, minLength: 3, maxLength: 2000 }
        status: { $ref: "#/components/schemas/InvestigationStatus" }
    Investigation:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - caseId
        - title
        - objective
        - status
        - revision
        - createdAt
        - updatedAt
        - completedAt
        - archivedAt
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        status: { $ref: "#/components/schemas/InvestigationStatus" }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    InvestigationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Investigation" }
    NodeFieldType:
      type: string
      enum: [STRING, NUMBER, BOOLEAN, DATE, IDENTIFIER, RESOURCE_REF]
    NodeDefinitionCategory:
      type: string
      enum: [COLLECTION, ENRICHMENT, ANALYSIS]
    NodeDefinitionStatus:
      type: string
      enum: [ACTIVE, DEPRECATED]
    NodeField:
      type: object
      additionalProperties: false
      required: [name, type, required]
      properties:
        name: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_.]{0,63}$' }
        type: { $ref: "#/components/schemas/NodeFieldType" }
        required: { type: boolean }
        classification: { $ref: "#/components/schemas/DataClassification" }
    NodeDefinition:
      type: object
      additionalProperties: false
      description: >-
        A capability request, never a connector implementation. capability
        is an abstract token (e.g. PERSON_LOOKUP); it never names a
        connector. There is no public write endpoint (see ADR-017).
      required:
        - id
        - key
        - version
        - category
        - capability
        - inputs
        - outputs
        - configSchema
        - executionPolicy
        - reviewPolicy
        - requiredPermission
        - presentation
        - status
        - createdAt
      properties:
        id: { type: string, format: uuid }
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        version: { type: integer, minimum: 1 }
        category: { $ref: "#/components/schemas/NodeDefinitionCategory" }
        capability: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$' }
        inputs:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/NodeField" }
        outputs:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/NodeField" }
        configSchema:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/NodeField" }
        executionPolicy:
          type: object
          additionalProperties: false
          required: [timeoutSeconds, retryable]
          properties:
            timeoutSeconds: { type: integer, minimum: 1, maximum: 3600 }
            retryable: { type: boolean }
        reviewPolicy:
          type: object
          additionalProperties: false
          required: [requiresHumanReview]
          properties:
            requiresHumanReview: { type: boolean }
        requiredPermission:
          type: string
          description: A Permission registered by Governance.
        presentation:
          type: object
          additionalProperties: false
          required: [label, description]
          properties:
            label: { type: string, minLength: 1, maxLength: 120 }
            description: { type: string, minLength: 1, maxLength: 1000 }
        status: { $ref: "#/components/schemas/NodeDefinitionStatus" }
        createdAt: { type: string, format: date-time }
    NodeInstanceStatus:
      type: string
      enum: [DRAFT, READY, ARCHIVED]
    NodeInstanceConfiguration:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: boolean
    CreateNodeInstanceRequest:
      type: object
      additionalProperties: false
      required: [nodeDefinitionKey, nodeDefinitionVersion]
      properties:
        nodeDefinitionKey: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        nodeDefinitionVersion: { type: integer, minimum: 1 }
        configuration: { $ref: "#/components/schemas/NodeInstanceConfiguration" }
    UpdateNodeInstanceRequest:
      type: object
      additionalProperties: false
      required: [configuration]
      properties:
        configuration: { $ref: "#/components/schemas/NodeInstanceConfiguration" }
    NodeInstance:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - caseId
        - investigationId
        - nodeDefinitionKey
        - nodeDefinitionVersion
        - configuration
        - status
        - revision
        - createdAt
        - updatedAt
        - archivedAt
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        investigationId: { type: string, format: uuid }
        nodeDefinitionKey: { type: string }
        nodeDefinitionVersion: { type: integer, minimum: 1 }
        configuration: { $ref: "#/components/schemas/NodeInstanceConfiguration" }
        status: { $ref: "#/components/schemas/NodeInstanceStatus" }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    InputBinding:
      type: object
      additionalProperties: false
      required: [targetInput, sourceExpression, sourceType, sourceClassification]
      properties:
        targetInput: { type: string }
        sourceExpression: { type: string, minLength: 1, maxLength: 200 }
        sourceType: { $ref: "#/components/schemas/NodeFieldType" }
        sourceClassification:
          oneOf:
            - $ref: "#/components/schemas/DataClassification"
            - type: "null"
    NodeInstanceDetail:
      allOf:
        - $ref: "#/components/schemas/NodeInstance"
        - type: object
          additionalProperties: false
          required:
            - id
            - workspaceId
            - caseId
            - investigationId
            - nodeDefinitionKey
            - nodeDefinitionVersion
            - configuration
            - status
            - revision
            - createdAt
            - updatedAt
            - archivedAt
            - inputBindings
          properties:
            id: { type: string, format: uuid }
            workspaceId: { type: string, format: uuid }
            caseId: { type: string, format: uuid }
            investigationId: { type: string, format: uuid }
            nodeDefinitionKey: { type: string }
            nodeDefinitionVersion: { type: integer, minimum: 1 }
            configuration: { $ref: "#/components/schemas/NodeInstanceConfiguration" }
            status: { $ref: "#/components/schemas/NodeInstanceStatus" }
            revision: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            archivedAt: { type: [string, "null"], format: date-time }
            inputBindings:
              type: array
              maxItems: 20
              items: { $ref: "#/components/schemas/InputBinding" }
    ReplaceInputBindingsRequest:
      type: object
      additionalProperties: false
      required: [bindings]
      properties:
        bindings:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [targetInput, sourceExpression, sourceType]
            properties:
              targetInput: { type: string }
              sourceExpression: { type: string, minLength: 1, maxLength: 200 }
              sourceType: { $ref: "#/components/schemas/NodeFieldType" }
              sourceClassification:
                oneOf:
                  - $ref: "#/components/schemas/DataClassification"
                  - type: "null"
    WorkflowEdge:
      type: object
      additionalProperties: false
      required: [id, investigationId, fromNodeInstanceId, toNodeInstanceId, createdAt]
      properties:
        id: { type: string, format: uuid }
        investigationId: { type: string, format: uuid }
        fromNodeInstanceId: { type: string, format: uuid }
        toNodeInstanceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CreateWorkflowEdgeRequest:
      type: object
      additionalProperties: false
      required: [fromNodeInstanceId, toNodeInstanceId]
      properties:
        fromNodeInstanceId: { type: string, format: uuid }
        toNodeInstanceId: { type: string, format: uuid }
    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, PARTIAL, FAILED, CANCELLED]
    RunTrigger:
      type: string
      enum: [MANUAL]
    RunInputSnapshot:
      type: object
      additionalProperties: false
      description: >-
        Frozen structural copy taken at Run-creation time; not live-resolved
        values. Resolution against live resources is deferred to future
        Execution/ExecutionPlan work (P3-005+).
      required: [configuration, inputBindings]
      properties:
        configuration: { $ref: "#/components/schemas/NodeInstanceConfiguration" }
        inputBindings:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/InputBinding" }
    Run:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - caseId
        - investigationId
        - nodeInstanceId
        - nodeDefinitionKey
        - nodeDefinitionVersion
        - inputSnapshot
        - status
        - trigger
        - triggeredByUserId
        - parentRunId
        - retryOf
        - revision
        - createdAt
        - updatedAt
        - startedAt
        - completedAt
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        investigationId: { type: string, format: uuid }
        nodeInstanceId: { type: string, format: uuid }
        nodeDefinitionKey: { type: string }
        nodeDefinitionVersion: { type: integer, minimum: 1 }
        inputSnapshot: { $ref: "#/components/schemas/RunInputSnapshot" }
        status: { $ref: "#/components/schemas/RunStatus" }
        trigger: { $ref: "#/components/schemas/RunTrigger" }
        triggeredByUserId: { type: string }
        parentRunId: { type: [string, "null"], format: uuid }
        retryOf: { type: [string, "null"], format: uuid }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    AttemptProgress:
      type: object
      additionalProperties: false
      required: [stage, processed, produced, total]
      properties:
        stage: { type: string, minLength: 1, maxLength: 64 }
        processed: { type: [integer, "null"], minimum: 0 }
        produced: { type: [integer, "null"], minimum: 0 }
        total:
          type: [integer, "null"]
          minimum: 0
          description: Never used to derive a percentage; stays null when the total is unknown.
    ExecutionAttemptStatus:
      type: string
      enum: [LEASED, RUNNING, SUCCEEDED, FAILED, LOST]
    ExecutionAttempt:
      type: object
      additionalProperties: false
      description: >-
        Physical attempt (ADR-020). Run != ExecutionAttempt: this is a
        worker's lease on a Run, not the Run itself.
      required:
        - id
        - runId
        - workspaceId
        - caseId
        - attemptNumber
        - workerIdentity
        - leaseOwner
        - leaseDurationSeconds
        - leasedUntil
        - status
        - errorCode
        - retryable
        - lastProgress
        - startedAt
        - heartbeatAt
        - completedAt
        - revision
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        attemptNumber: { type: integer, minimum: 1 }
        workerIdentity: { type: string }
        leaseOwner: { type: string, minLength: 1, maxLength: 200 }
        leaseDurationSeconds: { type: integer, minimum: 1, maximum: 300 }
        leasedUntil: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ExecutionAttemptStatus" }
        errorCode: { type: [string, "null"] }
        retryable: { type: [boolean, "null"] }
        lastProgress:
          oneOf:
            - { $ref: "#/components/schemas/AttemptProgress" }
            - { type: "null" }
        startedAt: { type: string, format: date-time }
        heartbeatAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExecutionPlan:
      type: object
      additionalProperties: false
      description: >-
        Immutable worker-facing contract (ADR-021). connector and checkpoint
        are always null in this slice: Source Registry is P4-001+ and
        checkpoint/resume is P3-009, neither exists yet. Structurally never
        carries a secret/apiKey/token/credential/password-shaped field.
      required:
        - runId
        - attempt
        - capability
        - connector
        - input
        - limits
        - accessContext
        - checkpoint
      properties:
        runId: { type: string, format: uuid }
        attempt:
          type: object
          additionalProperties: false
          required: [id, attemptNumber, leaseOwner]
          properties:
            id: { type: string, format: uuid }
            attemptNumber: { type: integer, minimum: 1 }
            leaseOwner: { type: string }
        capability: { type: string }
        connector:
          oneOf:
            - type: object
              additionalProperties: false
              required: [connectorId, version]
              properties:
                connectorId: { type: string }
                version: { type: integer, minimum: 1 }
            - { type: "null" }
        input: { $ref: "#/components/schemas/RunInputSnapshot" }
        limits:
          type: object
          additionalProperties: false
          required: [timeoutSeconds]
          properties:
            timeoutSeconds: { type: integer, minimum: 1 }
        accessContext:
          type: object
          additionalProperties: false
          required: [workspaceId, caseId, investigationId, triggeredByUserId]
          properties:
            workspaceId: { type: string, format: uuid }
            caseId: { type: string, format: uuid }
            investigationId: { type: string, format: uuid }
            triggeredByUserId: { type: string }
        checkpoint:
          type: "null"
    SystemInfo:
      type: object
      additionalProperties: false
      required: [service, status, requestId, traceId, version]
      properties:
        service:
          type: string
          const: platform-api
        status:
          type: string
          const: ok
        requestId:
          type: string
        traceId:
          type: string
        version:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: AUTH_UNAUTHENTICATED
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
