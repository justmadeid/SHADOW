            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400":
          description: Invalid Case identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
