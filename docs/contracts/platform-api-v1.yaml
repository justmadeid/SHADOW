openapi: 3.1.0
info:
  title: Investigation Intelligence Platform API
  version: 1.0.0
  description: Public Platform API contract expanded incrementally by implementation slice.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - oidcAccessToken: []
paths:
  /workspaces:
    post:
      operationId: createWorkspace
      summary: Create a workspace and initial membership
      tags: [Workspace]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created, or the equivalent idempotent result
          headers:
            Location:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Invalid request or idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: A service principal cannot create a user workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Slug or idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listWorkspaces
      summary: List active workspaces for the authenticated user
      tags: [Workspace]
      responses:
        "200":
          description: Membership-scoped workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Read a workspace visible through active membership
      tags: [Workspace]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workspace detail
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400":
          description: Invalid workspace identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Workspace absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cases:
    post:
      operationId: createCase
      summary: Create a draft Case in an accessible Workspace
      tags: [Case]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCaseRequest" }
      responses:
        "201":
          description: Case created, or the equivalent idempotent result
          headers:
            Location:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400":
          description: Invalid request or idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Operation requires a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Workspace absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Idempotency or generated-code conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listCases
      summary: List Cases in an accessible Workspace
      tags: [Case]
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workspace-scoped Case list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseList" }
        "400":
          description: Invalid Workspace identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Operation requires a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Workspace absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cases/{caseId}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: getCase
      summary: Read an accessible Case
      tags: [Case]
      responses:
        "200":
          description: Case detail
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400":
          description: Invalid Case identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Operation requires a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Case absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: updateCase
      summary: Update mutable Case metadata
      tags: [Case]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCaseRequest" }
      responses:
        "200":
          description: Updated Case
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400":
          description: Invalid body, identifier, or If-Match header
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Operation requires a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Case absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Case status does not permit metadata changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412":
          description: If-Match revision is stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cases/{caseId}/actions/close:
    post:
      operationId: closeCase
      summary: Close a draft or active Case
      tags: [Case]
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/CaseMutationSuccess" }
        "400": { $ref: "#/components/responses/CaseMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409": { $ref: "#/components/responses/CaseTransitionConflict" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /cases/{caseId}/actions/reopen:
    post:
      operationId: reopenCase
      summary: Reopen a closed Case as active
      tags: [Case]
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/CaseMutationSuccess" }
        "400": { $ref: "#/components/responses/CaseMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409": { $ref: "#/components/responses/CaseTransitionConflict" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /cases/{caseId}/actions/archive:
    post:
      operationId: archiveCase
      summary: Permanently move a non-archived Case to archived status
      tags: [Case]
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/CaseMutationSuccess" }
        "400": { $ref: "#/components/responses/CaseMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409": { $ref: "#/components/responses/CaseTransitionConflict" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /cases/{caseId}/investigations:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: createInvestigation
      summary: Create an Investigation branch under an accessible Case
      tags: [Investigation]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvestigationRequest" }
      responses:
        "201":
          description: Investigation created, or equivalent idempotent result
          headers:
            Location:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Investigation" }
        "400": { $ref: "#/components/responses/InvestigationMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409":
          description: Idempotency conflict or parent Case is not mutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listInvestigations
      summary: List Investigation branches under an accessible Case
      tags: [Investigation]
      responses:
        "200":
          description: Case-scoped Investigation list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestigationList" }
        "400": { $ref: "#/components/responses/InvestigationMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
  /investigations/{investigationId}:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    get:
      operationId: getInvestigation
      summary: Read an accessible Investigation
      tags: [Investigation]
      responses:
        "200":
          description: Investigation detail
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Investigation" }
        "400": { $ref: "#/components/responses/InvestigationMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/InvestigationNotFound" }
    patch:
      operationId: updateInvestigation
      summary: Update Investigation metadata or lifecycle status
      tags: [Investigation]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvestigationRequest" }
      responses:
        "200":
          description: Updated Investigation
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Investigation" }
        "400": { $ref: "#/components/responses/InvestigationMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/InvestigationNotFound" }
        "409":
          description: Investigation lifecycle transition is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Read authenticated platform runtime information
      tags: [System]
      responses:
        "200":
          description: Platform runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          description: Missing, malformed, expired, or otherwise invalid access token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer authentication challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted revision from the latest Case ETag.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
        example: '"1"'
    InvestigationId:
      name: investigationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    CaseMutationSuccess:
      description: Mutated Case
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Case" }
    CaseMutationInvalid:
      description: Invalid Case identifier or If-Match header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthenticated:
      description: Invalid authentication
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UserPrincipalRequired:
      description: Operation requires a user principal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseNotFound:
      description: Case absent or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseTransitionConflict:
      description: Case status transition is not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseRevisionMismatch:
      description: If-Match revision is stale
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvestigationMutationInvalid:
      description: Invalid Investigation request, identifier, or If-Match header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvestigationNotFound:
      description: Investigation absent or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  securitySchemes:
    oidcAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token validated against the configured issuer JWKS.
  schemas:
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name, slug, locale, timeZone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$"
        locale:
          type: string
        timeZone:
          type: string
    WorkspaceSettings:
      type: object
      additionalProperties: false
      required: [locale, timeZone]
      properties:
        locale: { type: string }
        timeZone: { type: string }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, settings, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
        revision:
          type: integer
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Workspace"
    DataClassification:
      type: string
      enum: [PUBLIC, INTERNAL, SENSITIVE, RESTRICTED]
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, title, classification]
      properties:
        workspaceId: { type: string, format: uuid }
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 4000
        classification:
          $ref: "#/components/schemas/DataClassification"
    UpdateCaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 4000
        classification:
          $ref: "#/components/schemas/DataClassification"
    Case:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - workspaceId
        - title
        - description
        - status
        - classification
        - revision
        - createdAt
        - updatedAt
        - closedAt
        - archivedAt
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          pattern: "^CASE-[0-9]{4}-[A-F0-9]{10}$"
        workspaceId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        status:
          type: string
          enum: [DRAFT, ACTIVE, CLOSED, ARCHIVED]
        classification:
          $ref: "#/components/schemas/DataClassification"
        revision:
          type: integer
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    CaseList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Case"
    InvestigationStatus:
      type: string
      enum: [ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    CreateInvestigationRequest:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        objective: { type: string, minLength: 3, maxLength: 2000 }
    UpdateInvestigationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        objective: { type: string, minLength: 3, maxLength: 2000 }
        status: { $ref: "#/components/schemas/InvestigationStatus" }
    Investigation:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - caseId
        - title
        - objective
        - status
        - revision
        - createdAt
        - updatedAt
        - completedAt
        - archivedAt
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        status: { $ref: "#/components/schemas/InvestigationStatus" }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    InvestigationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Investigation" }
    SystemInfo:
      type: object
      additionalProperties: false
      required: [service, status, requestId, traceId, version]
      properties:
        service:
          type: string
          const: platform-api
        status:
          type: string
          const: ok
        requestId:
          type: string
        traceId:
          type: string
        version:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: AUTH_UNAUTHENTICATED
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
