      responses:
        "200": { $ref: "#/components/responses/CaseMutationSuccess" }
        "400": { $ref: "#/components/responses/CaseMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409": { $ref: "#/components/responses/CaseTransitionConflict" }
