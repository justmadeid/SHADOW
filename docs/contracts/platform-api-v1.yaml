openapi: 3.1.0
info:
  title: Investigation Intelligence Platform API
  version: 1.0.0
  description: >-
    Public Platform API contract expanded incrementally by implementation slice.
    Case and Investigation operations require active Workspace membership plus
    explicit membership of the containing Case. OWNER can read, edit, and manage
    Case membership; EDITOR can read and edit; VIEWER can read only. Membership
    administration currently has no public HTTP surface. Denied resource access
    returns the same 404 contract as a missing resource; broad Workspace or
    entity-discovery grants do not bypass Case membership. Classification-specific
    restrictions are evaluated by Governance policy hooks and are not implied by
    these roles. Case handling metadata describes obligations, not an access grant.
    Export/source runtime enforcement remains a later slice. P2-004 identifier
    endpoints use encrypted storage, keyed comparison fingerprints, server-side
    field visibility and durable audit before protected disclosure. P2-005 adds
    read-only ResolutionSession/Candidate review resources; start and resolve commands
    remain reserved for the P2-008 atomic coordinator.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - oidcAccessToken: []
paths:
  /workspaces/{workspaceId}/entities:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createEntity
      summary: Create a manually curated Workspace Entity
      tags: [Entity Registry]
      description: >-
        Active Workspace membership and WORKSPACE_MANAGE are required. This is a
        restricted manual curation/import path; the normal Subject identity path
        remains Candidate Resolution in P2-008. Only thin identity fields are
        accepted. Identifier, Case context, Knowledge and merge fields are rejected.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._~:+/-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEntity" }
      responses:
        "201":
          description: Created or replayed Entity
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entity" }
        "400": { $ref: "#/components/responses/EntityError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/EntityError" }
        "409": { $ref: "#/components/responses/EntityError" }
        "500": { $ref: "#/components/responses/EntityError" }
    get:
      operationId: listEntities
      summary: List authorized thin identities in a Workspace
      tags: [Entity Registry]
      description: >-
        Active Workspace membership and WORKSPACE_VIEW are required. Returns identity
        only and never reveals Case membership, Evidence, allegations or Knowledge.
        This is not the possible-match/disclosure query owned by P2-007.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bounded Entity page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/Entity" }
                  page:
                    type: object
                    additionalProperties: false
                    required: [hasMore, nextCursor]
                    properties:
                      hasMore: { type: boolean }
                      nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/EntityError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/EntityError" }
  /entities/{entityId}:
    parameters:
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEntity
      summary: Read a Workspace Entity
      tags: [Entity Registry]
      description: Active Workspace membership and WORKSPACE_VIEW are required; absent and inaccessible Entities share the same response.
      responses:
        "200": { $ref: "#/components/responses/EntitySuccess" }
        "400": { $ref: "#/components/responses/EntityError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/EntityError" }
    patch:
      operationId: updateEntity
      summary: Rename, add an alias, or archive an Entity
      tags: [Entity Registry]
      description: >-
        Active Workspace membership and WORKSPACE_MANAGE are required. Exactly one
        command is accepted. Rename preserves the old canonical label as an alias;
        aliases are append-only. Type and Workspace are immutable. MERGED status and
        mergedInto are reserved for the auditable P2-011 merge command.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEntity" }
      responses:
        "200": { $ref: "#/components/responses/EntitySuccess" }
        "400": { $ref: "#/components/responses/EntityError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/EntityError" }
        "409": { $ref: "#/components/responses/EntityError" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
        "500": { $ref: "#/components/responses/EntityError" }
  /entities/{entityId}/identifiers:
    parameters:
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createEntityIdentifier
      summary: Add a protected identifier to an active Entity
      tags: [Entity Registry]
      description: >-
        Active Workspace membership plus WORKSPACE_VIEW and WORKSPACE_MANAGE are
        required. The server normalizes the controlled value, encrypts it with
        authenticated randomized encryption and derives a Workspace/type-bound keyed
        comparison fingerprint. The response is always fixed-mask and never echoes
        the submitted value. Duplicate identifier values within one Workspace conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._~:+/-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIdentifier" }
      responses:
        "201":
          description: Created or replayed masked Identifier
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentifierView" }
        "400": { $ref: "#/components/responses/EntityError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/EntityError" }
        "409": { $ref: "#/components/responses/EntityError" }
        "500": { $ref: "#/components/responses/EntityError" }
    get:
      operationId: listEntityIdentifiers
      summary: List safe Identifier metadata for an Entity
      tags: [Entity Registry]
      description: >-
        Active Workspace membership and WORKSPACE_VIEW are required. Collection
        responses are always fixed-mask; clients must explicitly request one
        Identifier through the audited detail boundary for any stronger visibility.
      responses:
        "200":
          description: Fixed-mask Identifier list
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/IdentifierView" }
        "400": { $ref: "#/components/responses/EntityError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/EntityError" }
  /identifiers/{identifierId}:
    parameters:
      - name: identifierId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEntityIdentifier
      summary: Read an Identifier through field-level policy and audit
      tags: [Entity Registry]
      description: >-
        Without a restricted grant and a valid reason, SENSITIVE/RESTRICTED values
        remain fixed-mask. IDENTIFIER_USE_RESTRICTED yields MATCH_ONLY and never raw
        content. IDENTIFIER_VIEW_RESTRICTED plus a reason may yield FULL only after
        the critical Audit transaction commits. The operation ID gives retries a
        stable audit identity and is required whenever a reason is supplied.
      parameters:
        - name: X-Reason-For-Access
          in: header
          required: false
          schema:
            type: string
            enum: [IDENTITY_VERIFICATION, DUPLICATE_REVIEW, AUTHORIZED_INVESTIGATION, DATA_QUALITY_REVIEW]
        - name: X-Audit-Operation-Id
          in: header
          required: false
          description: Required whenever X-Reason-For-Access is supplied.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Policy-derived Identifier view
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentifierView" }
        "400": { $ref: "#/components/responses/EntityError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/EntityError" }
        "409": { $ref: "#/components/responses/EntityError" }
        "503": { $ref: "#/components/responses/EntityError" }
  /cases/{caseId}/subjects:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: createSubject
      summary: Create an unresolved Case Subject
      tags: [Subject]
      description: >-
        Active Workspace and Case OWNER/EDITOR membership required. Parent Case must
        be DRAFT or ACTIVE. Optional Investigation must be ACTIVE in the same Case.
        An optional immutable seed accepts only controlled, classified
        investigator-input fields; canonical Evidence/Source provenance is reserved
        for trusted server-side integrations. RESTRICTED seed storage is unavailable
        until the protected identifier slice. Entity linkage and resolution status
        are not writable. Replay returns the current Subject after reauthorization;
        changed payload with the same key conflicts. Creates Subject, seed, revision
        history and Outbox in one transaction.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200, pattern: '^[A-Za-z0-9._~:+/-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSubject" }
      responses:
        "201":
          description: Created or replayed Subject
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestigationSubject" }
        "400": { $ref: "#/components/responses/SubjectError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/SubjectError" }
        "409": { $ref: "#/components/responses/SubjectError" }
        "500": { $ref: "#/components/responses/SubjectError" }
    get:
      operationId: listSubjects
      summary: List authorized Subjects in a Case
      tags: [Subject]
      description: >-
        OWNER/EDITOR/VIEWER access required. Includes archived Subjects. Ordered by
        immutable UUIDv7 ID descending; cursor is bound to Workspace and Case and
        never grants access. Unknown query fields are rejected.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bounded Subject page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/InvestigationSubject" }
                  page:
                    type: object
                    additionalProperties: false
                    required: [hasMore, nextCursor]
                    properties:
                      hasMore: { type: boolean }
                      nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/SubjectError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/SubjectError" }
  /subjects/{subjectId}:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSubject
      summary: Read a Case-scoped Subject
      tags: [Subject]
      description: Absent and forbidden Subjects return the same SUBJECT_NOT_FOUND response.
      responses:
        "200": { $ref: "#/components/responses/SubjectSuccess" }
        "400": { $ref: "#/components/responses/SubjectError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/SubjectError" }
    patch:
      operationId: updateSubject
      summary: Change Subject role or archive it
      tags: [Subject]
      description: >-
        OWNER/EDITOR membership and mutable parent Case required. Exactly one of role
        or status is accepted. ARCHIVED is terminal. Identity, type, scope, seeds and
        resolution states cannot be changed through PATCH. No hard delete.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSubject" }
      responses:
        "200": { $ref: "#/components/responses/SubjectSuccess" }
        "400": { $ref: "#/components/responses/SubjectError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/SubjectError" }
        "409": { $ref: "#/components/responses/SubjectError" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
        "500": { $ref: "#/components/responses/SubjectError" }
  /subjects/{subjectId}/seed:
    parameters:
      - name: subjectId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSubjectSeed
      summary: Read an authorized Subject's immutable seed
      tags: [Subject]
      description: >-
        OWNER/EDITOR/VIEWER Case membership required. SENSITIVE values are returned
        only as fixed masking; PUBLIC and INTERNAL values are returned in full.
        Subject list and detail responses expose seed metadata only, never field values.
      responses:
        "200":
          description: Immutable seed with policy-presented field values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectSeed" }
        "400": { $ref: "#/components/responses/SubjectError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/SubjectError" }
  /resolutions/{resolutionId}:
    parameters:
      - name: resolutionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getResolutionSession
      summary: Read an authorized Subject Resolution session
      tags: [Resolution]
      description: >-
        Requires current SUBJECT_VIEW access to the containing Case. Absent and
        inaccessible sessions return the same RESOLUTION_NOT_FOUND response. This
        P2-005 read surface cannot start a session or perform a decision; atomic
        Subject and Entity mutation remains P2-008.
      responses:
        "200": { $ref: "#/components/responses/ResolutionSuccess" }
        "400": { $ref: "#/components/responses/ResolutionError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/ResolutionError" }
  /resolutions/{resolutionId}/candidates:
    parameters:
      - name: resolutionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listResolutionCandidates
      summary: List review Candidates for a Resolution session
      tags: [Resolution]
      description: >-
        Requires current SUBJECT_VIEW access. Ordered by immutable UUIDv7 ID
        descending. Cursor is bound to Resolution, Workspace and Case. Candidate
        source references are provenance pointers, not access grants. P2-006 defines
        persisted matching/conflict signals; their governance-aware Entity discovery
        endpoint remains P2-007.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bounded Candidate page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, page]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/Candidate" }
                  page:
                    type: object
                    additionalProperties: false
                    required: [hasMore, nextCursor]
                    properties:
                      hasMore: { type: boolean }
                      nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/ResolutionError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/ResolutionError" }
  /resolutions/{resolutionId}/matches:
    parameters:
      - name: resolutionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listResolutionEntityMatches
      summary: List governance-filtered possible Entity matches
      tags: [Resolution]
      description: >-
        Requires current SUBJECT_VIEW and DISCOVER_ENTITY_EXISTENCE in the containing
        Case context. The result reveals reusable Workspace Entity existence without
        any other Case name, Evidence, Finding or context. SENSITIVE/RESTRICTED
        MATCH_ONLY signals are omitted unless IDENTIFIER_USE_RESTRICTED is currently
        granted and both controlled access headers are supplied. Such disclosure is
        durably audited before the response is released. HIDDEN signals, protected
        values, masked values, fingerprints, scores and Entity labels are never
        returned. VIEW_CROSS_CASE_CONTEXT changes only detailsVisible; P2-007 returns
        no cross-Case details. Ordered by immutable match ID descending; cursor is
        bound to Resolution, Workspace and Case.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: X-Reason-For-Access
          in: header
          required: false
          description: Required with X-Audit-Operation-Id to request protected MATCH_ONLY signals.
          schema:
            type: string
            enum: [IDENTITY_VERIFICATION, DUPLICATE_REVIEW, AUTHORIZED_INVESTIGATION, DATA_QUALITY_REVIEW]
        - name: X-Audit-Operation-Id
          in: header
          required: false
          description: Stable UUID required whenever X-Reason-For-Access is supplied.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bounded, policy-filtered Entity match page
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityMatchPage" }
        "400": { $ref: "#/components/responses/ResolutionError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/ResolutionError" }
        "409": { $ref: "#/components/responses/ResolutionError" }
        "503": { $ref: "#/components/responses/ResolutionError" }
  /candidates/{candidateId}:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCandidate
      summary: Read a non-canonical identity Candidate
      tags: [Resolution]
      description: >-
        Requires current SUBJECT_VIEW access. Absent and inaccessible Candidates
        share CANDIDATE_NOT_FOUND. Source/evidence references remain Case-scoped and
        must be reauthorized when opened. RESTRICTED Candidates use a fixed
        non-identifying display label and policy-safe signal metadata. No Entity is
        created by this resource.
      responses:
        "200": { $ref: "#/components/responses/CandidateSuccess" }
        "400": { $ref: "#/components/responses/ResolutionError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/ResolutionError" }
  /session:
    get:
      operationId: getUserSession
      summary: Return minimal verified user identity for the web session
      tags: [Workspace]
      description: No tokens or role claims returned. Service principals are not browser users. Cache-Control is private, no-store.
      responses:
        "200":
          description: Verified user identity
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user:
                    type: object
                    required: [id]
                    additionalProperties: false
                    properties:
                      id: { type: string }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: User principal required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cases/{caseId}/access:
    get:
      operationId: getCaseAccess
      summary: Current Case capabilities for permission-aware UI
      tags: [Case]
      description: >-
        Requires current Workspace and Case access; absent and forbidden Cases both
        return 404. Capabilities are evaluated by Governance in canonical Case scope.
        This response is UI guidance, not a reusable authorization grant. All writes
        reauthorize independently. Cache-Control is private, no-store.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current allowed actions
          content:
            application/json:
              schema:
                type: object
                required: [caseId, workspaceId, permissions]
                additionalProperties: false
                properties:
                  caseId: { type: string, format: uuid }
                  workspaceId: { type: string, format: uuid }
                  permissions:
                    type: object
                    required: [view, update, createInvestigation, manageMembers]
                    additionalProperties: false
                    properties:
                      view: { type: boolean }
                      update: { type: boolean }
                      createInvestigation: { type: boolean }
                      manageMembers: { type: boolean }
        "400":
          description: Invalid Case ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: User principal required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Case absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /workspaces:
    post:
      operationId: createWorkspace
      summary: Create a workspace and initial membership
      tags: [Workspace]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: Workspace created, or the equivalent idempotent result
          headers:
            Location:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          description: Invalid request or idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: A service principal cannot create a user workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Slug or idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listWorkspaces
      summary: List active workspaces for the authenticated user
      tags: [Workspace]
      responses:
        "200":
          description: Membership-scoped workspace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Read a workspace visible through active membership
      tags: [Workspace]
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workspace detail
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400":
          description: Invalid workspace identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Workspace absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cases:
    post:
      operationId: createCase
      summary: Create a draft Case in an accessible Workspace
      description: >-
        Atomically creates the Case and grants its creator OWNER membership.
        Required membership audit and reference-only Outbox intents commit in
        the same transaction; audit failure rolls back creation.
        Idempotency replay rechecks access and never restores revoked membership.
      tags: [Case]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCaseRequest" }
      responses:
        "201":
          description: Case created, or the equivalent idempotent result
          headers:
            Location:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400":
          description: Invalid request or idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Operation requires a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Workspace absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Idempotency or generated-code conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Required durable audit unavailable (AUDIT_DURABILITY_FAILED); no Case creation committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listCases
      summary: List only Cases accessible to the current user in a Workspace
      description: >-
        Filters by active Case membership before pagination. Returns at most 100
        items ordered by descending Case ID. Cursor is opaque and bound to the
        requested Workspace; each page evaluates the current user's permissions.
      tags: [Case]
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: Opaque nextCursor from the preceding Case page
          schema: { type: string }
      responses:
        "200":
          description: Authorized Case page with hasMore and nextCursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseList" }
        "400":
          description: Invalid Workspace identifier or Case cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Operation requires a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Workspace absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cases/{caseId}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      operationId: getCase
      summary: Read an accessible Case
      tags: [Case]
      responses:
        "200":
          description: Case detail
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400":
          description: Invalid Case identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Operation requires a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Case absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: updateCase
      summary: Update mutable Case metadata
      tags: [Case]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCaseRequest" }
      responses:
        "200":
          description: Updated Case
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400":
          description: Invalid body, identifier, or If-Match header
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid authentication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Operation requires a user principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Case absent or intentionally undisclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Case status does not permit metadata changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412":
          description: If-Match revision is stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /cases/{caseId}/actions/close:
    post:
      operationId: closeCase
      summary: Close a draft or active Case
      tags: [Case]
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/CaseMutationSuccess" }
        "400": { $ref: "#/components/responses/CaseMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409": { $ref: "#/components/responses/CaseTransitionConflict" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /cases/{caseId}/actions/reopen:
    post:
      operationId: reopenCase
      summary: Reopen a closed Case as active
      tags: [Case]
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/CaseMutationSuccess" }
        "400": { $ref: "#/components/responses/CaseMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409": { $ref: "#/components/responses/CaseTransitionConflict" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /cases/{caseId}/actions/archive:
    post:
      operationId: archiveCase
      summary: Permanently move a non-archived Case to archived status
      tags: [Case]
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/CaseMutationSuccess" }
        "400": { $ref: "#/components/responses/CaseMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409": { $ref: "#/components/responses/CaseTransitionConflict" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /cases/{caseId}/investigations:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: createInvestigation
      summary: Create an Investigation branch under an accessible Case
      tags: [Investigation]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvestigationRequest" }
      responses:
        "201":
          description: Investigation created, or equivalent idempotent result
          headers:
            Location:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Investigation" }
        "400": { $ref: "#/components/responses/InvestigationMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
        "409":
          description: Idempotency conflict or parent Case is not mutable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    get:
      operationId: listInvestigations
      summary: List Investigation branches under an accessible Case
      tags: [Investigation]
      responses:
        "200":
          description: Case-scoped Investigation list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestigationList" }
        "400": { $ref: "#/components/responses/InvestigationMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/CaseNotFound" }
  /investigations/{investigationId}:
    parameters:
      - $ref: "#/components/parameters/InvestigationId"
    get:
      operationId: getInvestigation
      summary: Read an accessible Investigation
      tags: [Investigation]
      responses:
        "200":
          description: Investigation detail
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Investigation" }
        "400": { $ref: "#/components/responses/InvestigationMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/InvestigationNotFound" }
    patch:
      operationId: updateInvestigation
      summary: Update Investigation metadata or lifecycle status
      tags: [Investigation]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvestigationRequest" }
      responses:
        "200":
          description: Updated Investigation
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Investigation" }
        "400": { $ref: "#/components/responses/InvestigationMutationInvalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/UserPrincipalRequired" }
        "404": { $ref: "#/components/responses/InvestigationNotFound" }
        "409":
          description: Investigation lifecycle transition is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "412": { $ref: "#/components/responses/CaseRevisionMismatch" }
  /system/info:
    get:
      operationId: getSystemInfo
      summary: Read authenticated platform runtime information
      tags: [System]
      responses:
        "200":
          description: Platform runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          description: Missing, malformed, expired, or otherwise invalid access token
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer authentication challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted revision from the latest Case ETag.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
        example: '"1"'
    InvestigationId:
      name: investigationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    SubjectSuccess:
      description: Current Subject revision
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/InvestigationSubject" }
    EntitySuccess:
      description: Current Entity revision
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Entity" }
    ResolutionSuccess:
      description: Current Resolution session revision
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResolutionSession" }
    CandidateSuccess:
      description: Current Candidate revision
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Candidate" }
    EntityError:
      description: Invalid input, undisclosed resource, authorization/lifecycle/idempotency conflict or sanitized persistence failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    SubjectError:
      description: Invalid input, undisclosed resource, lifecycle/idempotency conflict or sanitized persistence failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ResolutionError:
      description: Invalid input, undisclosed resource, lifecycle/idempotency conflict or sanitized persistence failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseMutationSuccess:
      description: Mutated Case
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Case" }
    CaseMutationInvalid:
      description: Invalid Case identifier or If-Match header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthenticated:
      description: Invalid authentication
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UserPrincipalRequired:
      description: Operation requires a user principal
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseNotFound:
      description: Case absent or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseTransitionConflict:
      description: Case status transition is not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CaseRevisionMismatch:
      description: If-Match revision is stale
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvestigationMutationInvalid:
      description: Invalid Investigation request, identifier, or If-Match header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvestigationNotFound:
      description: Investigation absent or intentionally undisclosed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  securitySchemes:
    oidcAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token validated against the configured issuer JWKS.
  schemas:
    EntityType:
      type: string
      enum: [PERSON, ORGANIZATION, SOCIAL_ACCOUNT, EMAIL_ADDRESS, PHONE_NUMBER, LOCATION, ADDRESS, DOMAIN, WEBSITE, IP_ADDRESS, VEHICLE, DEVICE, DOCUMENT, EVENT]
    EntityAlias:
      type: object
      additionalProperties: false
      required: [id, label, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 200 }
        createdAt: { type: string, format: date-time }
    EntityRef:
      type: object
      additionalProperties: false
      required: [type, id, workspaceId]
      properties:
        type: { const: ENTITY }
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
    Entity:
      type: object
      additionalProperties: false
      required: [id, workspaceId, type, status, canonicalLabel, aliases, mergedInto, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/EntityType" }
        status: { type: string, enum: [ACTIVE, MERGED, ARCHIVED] }
        canonicalLabel: { type: string, minLength: 1, maxLength: 200 }
        aliases:
          type: array
          items: { $ref: "#/components/schemas/EntityAlias" }
        mergedInto:
          oneOf:
            - $ref: "#/components/schemas/EntityRef"
            - type: "null"
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateEntity:
      type: object
      additionalProperties: false
      required: [type, canonicalLabel]
      properties:
        type: { $ref: "#/components/schemas/EntityType" }
        canonicalLabel: { type: string, minLength: 1, maxLength: 200 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
    UpdateEntity:
      oneOf:
        - type: object
          additionalProperties: false
          required: [canonicalLabel]
          properties:
            canonicalLabel: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          additionalProperties: false
          required: [alias]
          properties:
            alias: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { const: ARCHIVED }
    IdentifierType:
      type: string
      enum: [NATIONAL_ID, PHONE, EMAIL, PLATFORM_USER_ID, USERNAME, INTERNAL_RESIDENT_ID]
    CreateIdentifier:
      type: object
      additionalProperties: false
      required: [type, value, classification]
      properties:
        type: { $ref: "#/components/schemas/IdentifierType" }
        value:
          type: string
          minLength: 3
          maxLength: 320
          description: Protected input; never echoed, logged, queued or stored in plaintext.
        classification: { $ref: "#/components/schemas/DataClassification" }
    IdentifierView:
      type: object
      additionalProperties: false
      required: [id, entityId, workspaceId, type, classification, status, revision, createdAt, updatedAt, visibility]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/IdentifierType" }
        classification: { $ref: "#/components/schemas/DataClassification" }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        visibility: { type: string, enum: [FULL, MASKED, MATCH_ONLY, HIDDEN] }
        displayValue:
          type: string
          description: Present only for FULL or MASKED; MASKED is always four bullets.
        matchStatus:
          type: string
          enum: [EXACT_MATCH, NO_MATCH, UNKNOWN]
          description: Present only for MATCH_ONLY; this read endpoint returns UNKNOWN.
    SubjectType:
      type: string
      enum: [PERSON, ORGANIZATION, SOCIAL_ACCOUNT, DOMAIN, UNKNOWN]
    SubjectRole:
      type: string
      enum: [PRIMARY_TARGET, SECONDARY_TARGET, PERSON_OF_INTEREST, RELATED_PERSON, WITNESS, UNKNOWN]
    CreateSubject:
      type: object
      additionalProperties: false
      required: [subjectType, role]
      properties:
        subjectType: { $ref: "#/components/schemas/SubjectType" }
        role: { $ref: "#/components/schemas/SubjectRole" }
        investigationId: { type: [string, "null"], format: uuid }
        seed: { $ref: "#/components/schemas/CreateSubjectSeed" }
    SubjectSeedFieldName:
      type: string
      enum: [DISPLAY_NAME, ORGANIZATION_NAME, USERNAME, DOMAIN_NAME, LOCATION_TEXT, SOCIAL_PROFILE_URL]
    CreateSubjectSeed:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [name, value, origin, classification]
            properties:
              name: { $ref: "#/components/schemas/SubjectSeedFieldName" }
              value:
                type: string
                minLength: 1
                maxLength: 2000
                description: Field-specific normalization applies; non-URL fields permit at most 300 characters.
              origin:
                type: string
                const: INVESTIGATOR_INPUT
                description: Public callers cannot assert Evidence, Source Record, extraction or import provenance.
              classification:
                allOf:
                  - $ref: "#/components/schemas/DataClassification"
                description: RESTRICTED seed values remain rejected; protected identifiers must use the P2-004 Entity Identifier endpoints.
    SubjectSeedSummary:
      type: object
      additionalProperties: false
      required: [id, fieldCount]
      properties:
        id: { type: string, format: uuid }
        fieldCount: { type: integer, minimum: 1, maximum: 20 }
    SubjectSeedProvenanceRef:
      type: object
      additionalProperties: false
      required: [type, id, workspaceId, caseId]
      properties:
        type: { type: string, enum: [EVIDENCE, SOURCE_RECORD] }
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
    PresentedSubjectSeedValue:
      oneOf:
        - type: object
          additionalProperties: false
          required: [classification, visibility, displayValue]
          properties:
            classification: { $ref: "#/components/schemas/DataClassification" }
            visibility: { const: FULL }
            displayValue: { type: string }
        - type: object
          additionalProperties: false
          required: [classification, visibility, displayValue]
          properties:
            classification: { const: SENSITIVE }
            visibility: { const: MASKED }
            displayValue: { const: "••••" }
    SubjectSeed:
      type: object
      additionalProperties: false
      required: [id, subjectId, workspaceId, caseId, fields, createdAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        fields:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, ordinal, name, origin, classification, evidenceRef, sourceRecordRef, value]
            properties:
              id: { type: string, format: uuid }
              ordinal: { type: integer, minimum: 0, maximum: 19 }
              name: { $ref: "#/components/schemas/SubjectSeedFieldName" }
              origin: { type: string, enum: [INVESTIGATOR_INPUT, SOURCE_RECORD, EVIDENCE, ANALYSIS_EXTRACTION, IMPORT] }
              classification: { $ref: "#/components/schemas/DataClassification" }
              evidenceRef:
                oneOf:
                  - $ref: "#/components/schemas/SubjectSeedProvenanceRef"
                  - type: "null"
              sourceRecordRef:
                oneOf:
                  - $ref: "#/components/schemas/SubjectSeedProvenanceRef"
                  - type: "null"
              value: { $ref: "#/components/schemas/PresentedSubjectSeedValue" }
    UpdateSubject:
      oneOf:
        - type: object
          additionalProperties: false
          required: [role]
          properties:
            role: { $ref: "#/components/schemas/SubjectRole" }
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { const: ARCHIVED }
    InvestigationSubject:
      type: object
      additionalProperties: false
      required: [id, workspaceId, caseId, investigationId, subjectType, role, status, entityRef, seed, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        investigationId: { type: [string, "null"], format: uuid }
        subjectType: { $ref: "#/components/schemas/SubjectType" }
        role: { $ref: "#/components/schemas/SubjectRole" }
        status:
          type: string
          enum: [UNRESOLVED, ARCHIVED]
          description: Resolution persistence is deferred to P2-003/P2-008.
        entityRef: { type: "null" }
        seed:
          oneOf:
            - $ref: "#/components/schemas/SubjectSeedSummary"
            - type: "null"
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ResolutionSession:
      type: object
      additionalProperties: false
      required: [id, subjectId, workspaceId, caseId, status, candidatesCount, selectedCandidateId, resolutionDecisionId, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        status: { type: string, enum: [SEARCHING, NEEDS_REVIEW, RESOLVED, CLOSED] }
        candidatesCount: { type: integer, minimum: 0 }
        selectedCandidateId: { type: [string, "null"], format: uuid }
        resolutionDecisionId: { type: [string, "null"], format: uuid }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CandidateResourceRef:
      type: object
      additionalProperties: false
      required: [type, id, workspaceId, caseId]
      properties:
        type: { type: string, enum: [SOURCE_RECORD, EVIDENCE, RUN, ANALYSIS] }
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
    CandidateSource:
      type: object
      additionalProperties: false
      required: [origin, resource]
      properties:
        origin: { type: string, enum: [INVESTIGATOR_INPUT, SOURCE_RECORD, EVIDENCE, RUN, ANALYSIS_EXTRACTION, IMPORT] }
        resource:
          oneOf:
            - $ref: "#/components/schemas/CandidateResourceRef"
            - type: "null"
    Candidate:
      type: object
      additionalProperties: false
      required: [id, resolutionSessionId, subjectId, workspaceId, caseId, type, status, displayLabel, classification, source, evidenceRefs, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        resolutionSessionId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        type: { type: string, enum: [PERSON, ORGANIZATION, SOCIAL_ACCOUNT, DOMAIN] }
        status: { type: string, enum: [PENDING_REVIEW, RESOLVED, REJECTED, UNCERTAIN] }
        displayLabel: { type: string, minLength: 1, maxLength: 200 }
        classification:
          type: string
          enum: [PUBLIC, INTERNAL, SENSITIVE, RESTRICTED]
          description: RESTRICTED Candidates always use the fixed displayLabel "Restricted candidate"; a raw restricted label is never accepted or persisted.
        source: { $ref: "#/components/schemas/CandidateSource" }
        evidenceRefs:
          type: array
          maxItems: 20
          items:
            allOf:
              - $ref: "#/components/schemas/CandidateResourceRef"
              - type: object
                properties:
                  type: { const: EVIDENCE }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EntityMatchSignal:
      type: object
      additionalProperties: false
      required: [field, result, strength, valueVisibility]
      properties:
        field:
          type: string
          enum: [NATIONAL_ID, PHONE, EMAIL, PLATFORM_USER_ID, USERNAME, INTERNAL_RESIDENT_ID, NAME, DATE_OF_BIRTH, DOMAIN, ACCOUNT_HANDLE]
        result: { type: string, enum: [EXACT_MATCH, PARTIAL_MATCH, NO_MATCH, CONFLICT] }
        strength: { type: string, enum: [WEAK, SUPPORTING, STRONG, CONTRADICTING] }
        valueVisibility: { type: string, enum: [FULL, MASKED, MATCH_ONLY] }
    EntityMatch:
      type: object
      additionalProperties: false
      required: [id, candidateId, entityRef, matchLevel, signals, conflicts, crossCaseContext, createdAt]
      properties:
        id: { type: string, format: uuid }
        candidateId: { type: string, format: uuid }
        entityRef: { $ref: "#/components/schemas/EntityRef" }
        matchLevel: { type: string, enum: [LOW, MEDIUM, HIGH, VERY_HIGH] }
        signals:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EntityMatchSignal" }
        conflicts:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EntityMatchSignal" }
        crossCaseContext:
          type: object
          additionalProperties: false
          required: [exists, detailsVisible]
          properties:
            exists: { type: boolean, const: true }
            detailsVisible:
              type: boolean
              description: Permission capability only; no cross-Case details are returned by P2-007.
        createdAt: { type: string, format: date-time }
    EntityMatchPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EntityMatch" }
        page:
          type: object
          additionalProperties: false
          required: [hasMore, nextCursor]
          properties:
            hasMore: { type: boolean }
            nextCursor: { type: [string, "null"] }
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [name, slug, locale, timeZone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{1,61}[a-z0-9])$"
        locale:
          type: string
        timeZone:
          type: string
    WorkspaceSettings:
      type: object
      additionalProperties: false
      required: [locale, timeZone]
      properties:
        locale: { type: string }
        timeZone: { type: string }
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, settings, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
        settings:
          $ref: "#/components/schemas/WorkspaceSettings"
        revision:
          type: integer
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Workspace"
    DataClassification:
      type: string
      enum: [PUBLIC, INTERNAL, SENSITIVE, RESTRICTED]
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, title, classification]
      properties:
        workspaceId: { type: string, format: uuid }
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 4000
        classification:
          $ref: "#/components/schemas/DataClassification"
    UpdateCaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 4000
        classification:
          $ref: "#/components/schemas/DataClassification"
    Case:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - workspaceId
        - title
        - description
        - status
        - classification
        - handling
        - revision
        - createdAt
        - updatedAt
        - closedAt
        - archivedAt
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          pattern: "^CASE-[0-9]{4}-[A-F0-9]{10}$"
        workspaceId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        status:
          type: string
          enum: [DRAFT, ACTIVE, CLOSED, ARCHIVED]
        classification:
          $ref: "#/components/schemas/DataClassification"
        handling:
          $ref: "#/components/schemas/ClassificationHandling"
        revision:
          type: integer
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    ClassificationHandling:
      type: object
      description: >-
        Server-derived P1-007 handling obligations, not authorization or proof
        of downstream enforcement. Clients must not override these values.
        PUBLIC does not bypass authenticated resource access. P1-007 does not
        turn these hints into export, retention, indexing, or source runtimes.
      additionalProperties: false
      required: [classification, policyVersion, identifierDefaultVisibility, applicationLogs, metricsLabels, queuePayload, searchProjection, rawPersistence, export, workerRouting, retention, objectAccess, crossCaseDisclosure]
      properties:
        classification:
          $ref: "#/components/schemas/DataClassification"
        policyVersion: { type: integer, const: 1 }
        identifierDefaultVisibility: { type: string, enum: [FULL, MASKED] }
        applicationLogs: { type: string, const: METADATA_ONLY }
        metricsLabels: { type: string, const: NO_CONTENT }
        queuePayload: { type: string, enum: [REFERENCES_ONLY, REFERENCES_AND_METADATA] }
        searchProjection: { type: string, enum: [ALLOWED_FIELDS, SCOPED, MINIMIZED_SCOPED, NO_RAW_VALUES] }
        rawPersistence: { type: string, enum: [SOURCE_POLICY, MINIMIZED, DISABLED_BY_DEFAULT] }
        export: { type: string, enum: [POLICY_REQUIRED, PERMISSION_REQUIRED, EXPLICIT_POLICY_REQUIRED, REDACTED_ONLY] }
        workerRouting: { type: string, enum: [GENERAL, POLICY_DEPENDENT, RESTRICTED] }
        retention: { type: string, enum: [SOURCE_POLICY, EXPLICIT, EXPLICIT_MINIMIZED] }
        objectAccess: { type: string, enum: [SCOPED, SHORT_LIVED, SHORT_LIVED_STRICT_AUTH] }
        crossCaseDisclosure: { type: string, enum: [POLICY_REQUIRED, EXPLICIT_PERMISSION, DENY_BY_DEFAULT] }
    CaseList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        page:
          type: object
          additionalProperties: false
          required: [hasMore, nextCursor]
          properties:
            hasMore: { type: boolean }
            nextCursor: { type: [string, "null"] }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Case"
    InvestigationStatus:
      type: string
      enum: [ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    CreateInvestigationRequest:
      type: object
      additionalProperties: false
      required: [title, objective]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        objective: { type: string, minLength: 3, maxLength: 2000 }
    UpdateInvestigationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        objective: { type: string, minLength: 3, maxLength: 2000 }
        status: { $ref: "#/components/schemas/InvestigationStatus" }
    Investigation:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - caseId
        - title
        - objective
        - status
        - revision
        - createdAt
        - updatedAt
        - completedAt
        - archivedAt
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        status: { $ref: "#/components/schemas/InvestigationStatus" }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
    InvestigationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Investigation" }
    SystemInfo:
      type: object
      additionalProperties: false
      required: [service, status, requestId, traceId, version]
      properties:
        service:
          type: string
          const: platform-api
        status:
          type: string
          const: ok
        requestId:
          type: string
        traceId:
          type: string
        version:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              example: AUTH_UNAUTHENTICATED
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
