name: Engineering Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  static:
    name: Static, unit, contract, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable Corepack and pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install --global pnpm@10.15.0
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static M0 gates
        run: pnpm m0:static

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable Corepack and pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install --global pnpm@10.15.0
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration

  end-to-end:
    name: End-to-end reference flow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable Corepack and pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install --global pnpm@10.15.0
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable Corepack and pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install --global pnpm@10.15.0
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Scan for secrets
        run: pnpm security:secrets
      - name: Audit production dependencies
        run: pnpm security:audit

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs:
      - static
      - integration
      - end-to-end
      - security
    runs-on: ubuntu-24.04
    steps:
      - name: Require every upstream gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs['end-to-end'].result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$E2E_RESULT" = success
          test "$SECURITY_RESULT" = success
